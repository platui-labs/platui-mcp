name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platui-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          path: platui-mcp
      # CORE_SSH_KEY: read-only deploy key registered on platui-labs/platui-mcp-core,
      # stored as an Actions secret here. Grants checkout access to that repo only.
      # (The default GITHUB_TOKEN cannot read other private repos.)
      - uses: actions/checkout@v4
        with:
          repository: platui-labs/platui-mcp-core
          ref: main
          ssh-key: ${{ secrets.CORE_SSH_KEY }}
          path: platui-mcp-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build platui-mcp-core (file:../platui-mcp-core dependency)
        working-directory: platui-mcp-core
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run verify
